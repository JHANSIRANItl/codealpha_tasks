<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern &amp; Co. — Help Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#127807;</span>
      <div>
        <h1>Fern &amp; Co.</h1>
        <p>Plant care help desk</p>
      </div>
    </div>
    <span class="status-dot" id="statusDot" title="Checking connection…"></span>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <div class="msg bot">
      <p>Hello — I'm the Fern &amp; Co. help bot. Ask me about shipping, returns, plant care, or your order, and I'll find the closest answer in our FAQ.</p>
    </div>
  </main>

  <form class="composer" id="composer">
    <input
      type="text"
      id="messageInput"
      placeholder="Ask a question, e.g. “when will my order arrive?”"
      autocomplete="off"
      required
    >
    <button type="submit" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12L21 3L14 21L11 13L3 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
